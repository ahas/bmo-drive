# The Files app this service's console screen is. The service ships no tool, so this declaration holds the
# `[app]` table alone, and its deployment publishes it on the delegation chain with `bmo pocket app
# deploy/app.toml` once the service answers ready, so a person's settings can switch the screen (bmo-pocket's
# docs/api.md, 「An app on the delegation chain」).

[app]
key = "drive"
name = "Files"
description = "Browses, reads, changes and shares the files on the machines a person reaches and in their own drive."
icon = "i-material-symbols-folder-open-outline"
offered = true
on = true
