# How the testbed checks, builds and deploys this repository, in the testbed's declaration format. The suite
# runs the repository-wide personal-data check (PERSONAL-DATA.md) and the behaviour tests standing so far
# (README.md).

testbed = 0
name = "bmo-drive"

[test]
# Cargo runs the personal-data check; Bun runs the console plugin bundle's check script.
languages = ["cargo", "bun"]

# The console plugin bundle under client/ is a project of its own: its manifest and lockfile stand in its own
# folder, outside any package workspace, and its check script installs its locked packages and typechecks it.
[projects]
paths = ["client"]

[check]
# The sweeps that read the tree before anything runs: Korean in the code, the README's folder table and the
# dependencies the manifests name. The ledger is the debt of Korean left in a code file, a file it does not
# name being allowed none; no code file of this repository holds any.
quick = ["korean", "layout", "dependencies", "cargo-profile"]
korean_ledger = "korean-ledger.json"
base_libraries = ["bmo-chat", "bmo-chat-client", "bmo-ui"]

[[check.step]]
id = "check"
command = "cargo check --all-targets"
lane = "wide"

[[check.step]]
id = "clippy"
command = "cargo clippy --all-targets -- -D warnings"
lane = "wide"

[[check.step]]
id = "fmt"
command = "cargo fmt --all --check"

[build]
binaries = ["bmo-drive"]

# The service's own deploy tree, and the data root its settings stand under: the data root's env/drive.toml,
# which each release links to as settings.local.toml, the file the service reads beside settings.toml
# (docs/api.md, 「Settings」).
[deploy]
root = "~/.local/share/bmo-drive"
link = "deploy"
data_root = "~/.local/share/bmo/data"
env_links = [{ link = "settings.local.toml", target = "env/drive.toml" }]
# The service's user unit, marked bot: the repository's one service, whose health the deployment waits on.
units = ["deploy/*.service"]
# Answers 0 once the service the deployed settings name answers ready (docs/api.md, 「Health」).
health = "~/.local/share/bmo-drive/deploy/bin/bmo-drive health"

# The console bundle the service serves from the release (docs/api.md, 「The console bundle」): its locked
# packages installed and its folder built inside client/, where the settings' console.folder reads it.
[[deploy.step]]
id = "console-bundle"
phase = "before-flip"
command = '''
set -eu
cd client
bun install --frozen-lockfile
bun run bundle
'''
