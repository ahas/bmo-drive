# What installing the file viewer on a fresh machine needs, read by the testbed's install verb (bmo-testbed's
# docs/install.md, 「The install declaration」). The settings are docs/api.md's 「Settings」.

install = 1

restart = "systemctl --user restart bmo-drive.service"

[[needs]]
program = "cargo"
what = "Builds the service; the Rust toolchain from https://rustup.rs."

[[needs]]
program = "bun"
what = "Builds the console bundle at every release; the Bun runtime from https://bun.sh."

[[port]]
name = "drive.server"
number = 3300

[[token]]
name = "drive.service"
file = "env/drive-service.token"

[[token]]
name = "drive.console"
file = "env/drive-console.token"

# The release's settings.local.toml. The BMO drive is a local folder under the data root; a share link stands
# under the console's public address, at the bundle's share page; the administrator is the owner's account on
# the account service. The node service is left at its default, so the nodes are listed only where one answers.
[[settings]]
file = "env/drive.toml"
text = """
[server]
listen = "127.0.0.1:{{port.drive.server}}"
token = "{{token.drive.service}}"

[store]
path = "{{data_root}}/drive/drive.db"

[share]
address = "{{input.web.public-address}}files/share"

[owners]
administrator = "{{value.web.owner-account}}"

[console]
token = "{{token.drive.console}}"

[storage]
kind = "local"
root = "{{data_root}}/drive/spaces"
"""

[[line]]
file = "env/web-console.env"
key = "DRIVE_ADDRESS"
value = "http://127.0.0.1:{{port.drive.server}}"

[[line]]
file = "env/web-console.env"
key = "DRIVE_TOKEN"
value = "{{token.drive.console}}"
