# The file viewer and its share links as one service: the HTTP server and its command in one binary.
# The only manifest at the root; the console plugin bundle keeps its own under `client/`.
[package]
name = "bmo-drive"
description = "The file viewer over this machine's drives, Garage and the nodes' volumes, and its share links."
version = "0.1.0"
edition = "2024"
publish = false

[lib]
test = false

[[bin]]
name = "bmo-drive"
path = "src/main.rs"
test = false

[dependencies]
# A folder's zip, written as it streams.
async_zip = { version = "0.0.19", default-features = false, features = ["tokio"] }
axum = "0.8.9"
# A zip entry's time, as this machine's clock writes it.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive"] }
# The settings: the built-in defaults, the deployment's files and the environment, layered in that order.
config = { version = "0.15", default-features = false, features = ["toml"] }
futures-util = { version = "0.3.34", features = ["io"] }
# The one byte range a request's Range header asks for.
http-range-header = "0.4.2"
# Each route registers itself beside its own answer.
inventory = "0.3.24"
# A file's type, guessed from its name.
mime_guess = "2.0.5"
# A file's name in a Content-Disposition header.
percent-encoding = "2.3.2"
# The scratch name an upload is written under.
rand = "0.9.2"
# The calls to the node service.
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# The share links' store, one SQLite file.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "2.0.17"
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.release]
debug = false
strip = "debuginfo"
