# The file viewer and its share links as one service: the HTTP server, its command, its client and its
# harness plugin in one binary. The only manifest at the root; the console plugin bundle keeps its own under
# `client/`.
[package]
name = "bmo-drive"
description = "The file viewer over this machine's drives, Garage and the nodes' volumes and each owner's own drive, its share links, its client and its MCP server."
version = "0.1.0-rev.7"
edition = "2024"
license = "MIT"
publish = false
# One test target, the harness at tests/main.rs (bmo-chat's docs/conventions.md, 「Rust builds」).
autotests = false

[lib]
test = false

[[bin]]
name = "bmo-drive"
path = "src/main.rs"
test = false

[dependencies]
# A folder's zip, written as it streams.
async_zip = { version = "0.0.19", default-features = false, features = ["tokio"] }
# Garage, reached as any S3 client reaches it, through a profile of the account's AWS configuration.
aws-runtime = "1.10.0"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-types = "1.6.0"
axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
# The console face: the manifest, the bundle's files and their guard, by bmo-ui's console plugin contract.
bmo-console-face = { path = "../../base/chat/console-face" }
# A jake hub's output chunks, a name handed to a Windows node's script, and a file's bytes in a tool answer.
base64 = "0.22.1"
# A zip entry's time, as this machine's clock writes it.
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.7", features = ["derive", "env"] }
# The settings: the built-in defaults, the deployment's files and the environment, layered in that order.
config = { version = "0.15", default-features = false, features = ["toml"] }
# A jake hub's token file, written as dotenv lines.
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", features = ["io"] }
# An upload's bytes handed to the S3 client as a body.
http-body-util = "0.1.3"
hyper = { version = "1.12.0", features = ["client", "http1", "http2", "server"] }
# The one byte range a request's Range header asks for.
http-range-header = "0.4.2"
# Each route registers itself beside its own answer.
inventory = "0.3.24"
# A file's type, guessed from its name.
mime_guess = "2.0.5"
# A file's name in a Content-Disposition header, and a place's name or a path in the client's paths.
percent-encoding = "2.3.2"
# The scratch name an upload is written under.
rand = "0.9.2"
# The calls to the node service, and the service's own client.
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
# The harness tools, served over MCP on standard input and output.
rmcp = { version = "3.5.1", default-features = false, features = ["server", "transport-io"] }
# A volume's free space.
rustix = { version = "1.1.5", default-features = false, features = ["fs", "std"] }
# The JSON Schemas of the wire types, for the OpenAPI document and the tools.
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# A word of a POSIX node's script, quoted as the shell reads it back whole.
shlex = "2.0.1"
# A jake hub's answer, a stream of server-sent events.
sse-stream = "0.2.6"
# The share links' and the events' store, one SQLite file.
sqlx = { version = "0.8.6", default-features = false, features = ["sqlite", "runtime-tokio", "macros", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
# Garage's own configuration file.
toml = { version = "0.8.23", default-features = false, features = ["parse"] }

[dev-dependencies]
# The personal data a tracked file may not hold (PERSONAL-DATA.md).
regex = "1.13.1"

[[test]]
name = "main"
path = "tests/main.rs"

# Build output kept small: line tables alone for a backtrace, split out, and no incremental cache.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"
strip = "debuginfo"
incremental = false

[profile.test.package."*"]
debug = false

[profile.release]
debug = false
strip = "debuginfo"
